# Windows x64 command-line conversion; run soffice.com with --headless.
# Windows requires the UI/rendering core: --disable-gui is not supported.
--host=x86_64-pc-cygwin
--with-visual-studio=2022
--disable-ccache
--disable-debug
--disable-dbgutil
--disable-symbols
--enable-skia
--without-java
--enable-python=no
--disable-cli
--without-dotnet
--disable-odk
--without-help
--disable-xmlhelp
--without-helppack-integration
--with-lang=en-US
--without-myspell-dicts
--with-galleries=no
--with-templates=no
--with-theme=colibre
--disable-database-connectivity
--disable-firebird-sdbc
--disable-report-builder
--disable-ext-wiki-publisher
--disable-ext-nlpsolver
--disable-scripting-beanshell
--disable-scripting-javascript
--disable-extension-integration
--disable-online-update
--disable-online-update-mar
--disable-extension-update
--disable-breakpad
--disable-crashdump
--without-junit
--without-package-format
# Keep fonts, locale data, Writer/Calc/Impress/Draw/Math and PDF import/export.
